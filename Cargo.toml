[workspace]
resolver = "2"
members = [
    "crates/robosim-core",
    "crates/robosim-render",
    "crates/robosim-ros2",
    "crates/robosim-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CommunityPokeOrg/robo-sim"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rand = "0.9"
anyhow = "1"
